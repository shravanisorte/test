name: Quality Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  databricks-quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Databricks Job
        id: run_databricks_job
        uses: databricks/run-notebook@v0
        with:
          databricks-host: ${{ secrets.DATABRICKS_HOST }}
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
          workspace-notebook-path: /Workspace/Users/traininguser5@sudosu.ai/test_casestudy
          existing-cluster-id: ${{ secrets.DATABRICKS_CLUSTER_ID }}

      - name: Download Deequ Report (if failed)
        if: failure()
        run: |
          echo "Deequ failed — see DBFS report"
